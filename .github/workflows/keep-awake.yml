# Keeps the LawerAI server (Render free plan) awake so the app answers quickly.
# Render free servers sleep after 15 idle minutes; this pings the health check every 10 minutes.
name: Keep server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://lawerai-api.onrender.com/health -o /dev/null && echo "server awake"
